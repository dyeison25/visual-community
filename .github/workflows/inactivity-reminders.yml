name: Recordatorios por correo

on:
  schedule:
    - cron: '17 15 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Simular sin enviar correos ni escribir registros del job
        required: true
        type: boolean
        default: true
      confirm_send:
        description: Confirmar un ensayo real limitado a los UIDs privados (requiere habilitación adicional)
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: visual-community-inactivity-reminders
  cancel-in-progress: false

jobs:
  reminders:
    if: github.repository == 'dyeison25/visual-community' && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    environment: reminder-tests
    timeout-minutes: 10
    steps:
      - name: Obtener código revisado
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Preparar Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.13'
      - name: Instalar sin ejecutar scripts de dependencias
        working-directory: Backend
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Comprobar TypeScript y compilar (sin secretos)
        working-directory: Backend
        run: bun run build
      - name: Enviar recordatorios programados a usuarios elegibles
        if: github.event_name == 'schedule'
        working-directory: Backend
        run: bun run reminders
        env:
          NODE_ENV: production
          EMAIL_PROVIDER: gmail_smtp
          FRONTEND_URL: https://sistemagestionpermanencia.web.app
          REMINDER_ENABLED: 'true'
          REMINDER_DRY_RUN: 'false'
          REMINDER_SEND_MODE: live
          # Solo el schedule general ignora la lista; el secreto se conserva en la ejecución manual.
          REMINDER_TEST_USER_IDS: ''
          REMINDER_INACTIVITY_DAYS: '4'
          REMINDER_MAX_ATTEMPTS: '3'
          REMINDER_BATCH_SIZE: '50'
          VC_REMINDER_CONFIRM_SEND: 'false'
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          NOTIFICATION_TOKEN_SECRET: ${{ secrets.NOTIFICATION_TOKEN_SECRET }}
      - name: Ejecutar ensayo manual protegido
        if: github.event_name == 'workflow_dispatch'
        working-directory: Backend
        run: bun run reminders
        env:
          NODE_ENV: production
          EMAIL_PROVIDER: gmail_smtp
          FRONTEND_URL: https://sistemagestionpermanencia.web.app
          REMINDER_ENABLED: ${{ vars.REMINDER_ENABLED == 'true' && 'true' || 'false' }}
          REMINDER_DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
          REMINDER_SEND_MODE: test
          REMINDER_INACTIVITY_DAYS: '4'
          REMINDER_MAX_ATTEMPTS: '3'
          REMINDER_BATCH_SIZE: '50'
          VC_REMINDER_CONFIRM_SEND: ${{ inputs.confirm_send && 'true' || 'false' }}
          REMINDER_TEST_USER_IDS: ${{ secrets.REMINDER_TEST_USER_IDS }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          NOTIFICATION_TOKEN_SECRET: ${{ secrets.NOTIFICATION_TOKEN_SECRET }}
